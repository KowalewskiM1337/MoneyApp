services:
  backend:
    build: ./backend
    container_name: moneyapp-backend
    environment:
      - DB_PATH=/app/data/moneyapp.db
    volumes:
      - sqlite_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: moneyapp-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
